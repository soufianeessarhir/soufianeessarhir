<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Soufiane Essarhir. Full-stack developer, backend engineer, n8n automation builder." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Soufiane Essarhir</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#150f33"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0e7ff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <clipPath id="card"><rect x="2" y="2" width="996" height="296" rx="20"/></clipPath>
    <clipPath id="typed"><rect class="reveal" x="116" y="140" width="768" height="44"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace; }

    .orb { transform-box: fill-box; transform-origin: center; }
    .o1 { animation: drift1 14s ease-in-out infinite alternate; }
    .o2 { animation: drift2 18s ease-in-out infinite alternate; }
    .o3 { animation: drift3 16s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(140px, 40px) scale(1.2); } }
    @keyframes drift2 { to { transform: translate(-160px, -30px) scale(0.85); } }
    @keyframes drift3 { to { transform: translate(-90px, 50px) scale(1.15); } }

    .sweep { animation: sweep 7s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-400px); } 60%, 100% { transform: translateX(1300px); } }

    .rise { opacity: 0; animation: rise 1.1s cubic-bezier(.2,.7,.2,1) .2s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .reveal { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
              animation: type 3.2s steps(64, end) 1.1s forwards; }
    @keyframes type { to { transform: scaleX(1); } }

    .cursor { animation: move 3.2s steps(64, end) 1.1s forwards, blink .9s step-end 1.1s infinite; opacity: 0; }
    @keyframes move { 0% { opacity: 1; transform: translateX(0); } 100% { opacity: 1; transform: translateX(768px); } }
    @keyframes blink { 50% { fill-opacity: 0; } }

    .pill { opacity: 0; animation: fade 1s ease 4.6s forwards; }
    @keyframes fade { to { opacity: 1; } }
    .dot { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.2); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .orb, .sweep, .rise, .reveal, .cursor, .pill, .dot { animation: none !important; }
      .rise, .pill { opacity: 1; }
      .reveal { transform: scaleX(1); }
      .cursor, .dot { display: none; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <circle class="orb o1" cx="170" cy="90" r="120" fill="#6366f1" opacity="0.55" filter="url(#blur)"/>
    <circle class="orb o2" cx="840" cy="210" r="120" fill="#22c55e" opacity="0.32" filter="url(#blur)"/>
    <circle class="orb o3" cx="560" cy="40" r="90" fill="#a78bfa" opacity="0.4" filter="url(#blur)"/>
    <rect class="sweep" x="0" y="0" width="260" height="300" fill="url(#sweep)" transform="skewX(-18)"/>
  </g>
  <rect x="2" y="2" width="996" height="296" rx="20" fill="none" stroke="url(#edge)" stroke-opacity="0.55" stroke-width="1.5"/>

  <g class="rise">
    <text x="500" y="108" text-anchor="middle" font-size="60" font-weight="700" letter-spacing="6" fill="url(#name)">SOUFIANE ESSARHIR</text>
  </g>

  <g clip-path="url(#typed)">
    <text class="mono" x="116" y="170" font-size="20" fill="#cbd5e1" textLength="768" lengthAdjust="spacing">Full-stack developer · Backend engineer · n8n automation builder</text>
  </g>
  <rect class="cursor" x="116" y="152" width="2.5" height="26" fill="#a78bfa"/>

  <g class="pill">
    <rect x="318" y="214" width="364" height="42" rx="21" fill="#0b1220" fill-opacity="0.7" stroke="#22c55e" stroke-opacity="0.55"/>
    <circle class="dot" cx="346" cy="235" r="4" fill="#22c55e"/>
    <circle cx="346" cy="235" r="4" fill="#22c55e"/>
    <text x="362" y="240" font-size="15" font-weight="600" fill="#d1fae5">Available for remote &amp; freelance work</text>
  </g>
</svg>
